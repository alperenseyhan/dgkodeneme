<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Galerim</title>
<style>
    body {
        margin: 0;
        background: #f5f0e8;
        font-family: Georgia, serif;
    }
    .gallery {
        position: relative;
        width: 100%;
        min-height: 100vh;
        overflow: hidden;
    }
    .photo {
        position: absolute;
        width: 150px;
        cursor: pointer;
        transition: transform 0.3s ease;
    }
    .photo img {
        width: 100%;
        display: block;
    }
    .photo:hover {
        transform: scale(1.08);
    }
    .photo:nth-child(1) {
        top: 10%;
        left: 10%;
        transform: rotate(-8deg);
    }
    .photo:nth-child(2) {
        top: 25%;
        right: 12%;
        transform: rotate(7deg);
    }
    .photo:nth-child(3) {
        top: 55%;
        left: 25%;
        transform: rotate(4deg);
    }
    .photo:nth-child(4) {
        top: 65%;
        right: 10%;
        transform: rotate(-6deg);
    }
    @media (max-width: 600px) {
        .photo {
            width: 115px;
        }
    }
</style>
</head>
<body>
<div class="gallery">
<div class="photo">
    <img src="https://placehold.co/400x500" alt="Fotoğraf 1">
</div>
<div class="photo">
    <img src="https://placehold.co/400x500" alt="Fotoğraf 2">
</div>
<div class="photo">
    <img src="https://placehold.co/400x500" alt="Fotoğraf 3">
</div>
<div class="photo">
    <img src="https://placehold.co/400x500" alt="Fotoğraf 4">
</div>
</div>
</body>
</html>
